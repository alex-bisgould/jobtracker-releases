<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- The authorization code transits this URL. It is inert without the PKCE
     verifier (which never leaves the user's Mac), but don't hand it to anyone. -->
<meta name="referrer" content="no-referrer">
<title>Signing you in — Job Tracker</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #16181d; --muted: #5b6270;
    --card: #f6f7f9; --rule: #e3e6ec; --accent: #2f6df6; --ok: #1a7f4b;
    --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --fg: #e7e9ee; --muted: #9aa2b1;
      --card: #181b21; --rule: #272b33; --accent: #7aa2ff; --ok: #4ade80;
      --bad: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 460px; margin: 24px; padding: 36px 32px;
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 14px; text-align: center;
  }
  .badge {
    --tone: var(--ok); /* JS swaps this to var(--bad) on an errored round-trip */
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 20px;
    display: grid; place-items: center; font-size: 27px; font-weight: 700;
    background: color-mix(in srgb, var(--tone) 16%, transparent); color: var(--tone);
  }
  .spinner {
    width: 52px; height: 52px; margin: 0 auto 20px; border-radius: 50%;
    border: 3px solid var(--rule); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -.01em; }
  p { margin: 0; color: var(--muted); }
  .btn {
    display: inline-block; margin-top: 22px; padding: 11px 22px;
    background: var(--accent); color: #fff; text-decoration: none;
    border-radius: 8px; font-weight: 600; font-size: 15px;
  }
  .hint {
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid var(--rule); font-size: 14px;
  }
  .hide { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="spinner" class="spinner" aria-hidden="true"></div>
  <div id="badge" class="badge hide" aria-hidden="true">&#10003;</div>

  <h1 id="title">Returning you to Job Tracker…</h1>
  <p id="detail">One moment — handing your sign-in back to the app.</p>

  <a id="open" class="btn hide" href="#">Open Job Tracker</a>

  <p id="hint" class="hint hide">
    You can close this tab. If Job Tracker didn't come to the front, switch to it
    manually — you'll already be signed in.
  </p>
</div>

<script>
(function () {
  "use strict";

  var TARGET = "jobtracker://auth/callback";

  // Only forward the params this flow actually uses. Copying the query wholesale
  // would let anyone append arbitrary junk to a custom-scheme URL handed to the OS.
  var ALLOWED = ["code", "jt_state", "state", "error", "error_description"];

  // Packet A2 — a successful custom-scheme launch backgrounds this tab on macOS,
  // so blur/pagehide/visibilitychange are a strong (not perfect — the user could
  // Cmd-Tab away for an unrelated reason) signal the handoff already happened.
  // Combined with the one-shot sessionStorage flag below (set only when the
  // button itself is clicked), this lets the success branch stop inviting a
  // SECOND launch of the same code+state — previously a replay hit "Sign-in
  // expired or was already used", an error toast, for a user who WAS signed in.
  // Registered BEFORE the location.replace(link) call below so the automatic
  // launch attempt is caught, not just a manual button click.
  var handedOff = false;
  window.addEventListener("blur", function () { handedOff = true; });
  window.addEventListener("pagehide", function () { handedOff = true; });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) handedOff = true;
  });

  // Params arrive in the QUERY for the authorization-code flow, but GoTrue
  // delivers a meaningful class of failures — provider misconfiguration, consent
  // errors — in the FRAGMENT instead. Reading only `search` silently swallowed
  // those: the page showed success and the app received no params at all, which
  // it reports as "cancelled", masking a real misconfiguration. Merge both,
  // query winning on collision.
  function incomingParams() {
    var merged = new URLSearchParams(window.location.search);
    var hash = window.location.hash.replace(/^#/, "");
    if (hash) {
      var fromHash = new URLSearchParams(hash);
      fromHash.forEach(function (value, key) {
        if (!merged.has(key)) merged.set(key, value);
      });
    }
    return merged;
  }

  function buildDeepLink(params) {
    var out = new URLSearchParams();
    for (var i = 0; i < ALLOWED.length; i++) {
      var v = params.get(ALLOWED[i]);
      if (v !== null) out.set(ALLOWED[i], v);
    }
    var qs = out.toString();
    return qs ? TARGET + "?" + qs : TARGET;
  }

  function show(id) { document.getElementById(id).classList.remove("hide"); }
  function hide(id) { document.getElementById(id).classList.add("hide"); }
  function setText(id, text) { document.getElementById(id).textContent = text; }

  var params = incomingParams();
  var code = params.get("code");
  var error = params.get("error");
  var link = buildDeepLink(params);
  var openBtn = document.getElementById("open");
  openBtn.setAttribute("href", link);

  // One-shot: this exact code was already handed off via the button earlier in
  // this tab's life (e.g. an earlier render of this same page — a bfcache
  // restore, a Back navigation). Wrapped in try/catch: sessionStorage can throw
  // in a locked-down/private context, in which case we just fall back to the
  // blur/visibility signal above.
  try {
    if (sessionStorage.getItem("jt-open-" + (code || ""))) handedOff = true;
  } catch (e) { /* sessionStorage unavailable — blur/visibility signal still applies */ }

  openBtn.addEventListener("click", function () {
    try { sessionStorage.setItem("jt-open-" + (code || ""), "1"); } catch (e) { /* best-effort */ }
    // Clicking a custom-scheme href doesn't navigate this page away, so this
    // visual state persists — it's the only feedback the click did anything.
    openBtn.style.opacity = "0.5";
    openBtn.style.pointerEvents = "none";
    openBtn.textContent = "Opening…";
  });

  // No code and no error means someone opened this page directly.
  if (!code && !error) {
    hide("spinner");
    setText("title", "Nothing to hand over");
    setText("detail", "This page finishes a Job Tracker sign-in. Start from the app's sign-in button.");
    return;
  }

  // Browsers may block an external-protocol launch without a user gesture, so
  // always surface the manual button as a fallback rather than relying on this.
  // Hand the app the error too — it needs to clear its pending-sign-in state.
  try { window.location.replace(link); } catch (e) { /* fall through to the button */ }

  // An errored round-trip must NOT claim success. Previously this branch was
  // unconditional, so declining consent at Google rendered a green check reading
  // "You're signed in" — directly contradicting the app, which correctly said the
  // sign-in was cancelled.
  setTimeout(function () {
    hide("spinner");
    if (error) {
      var cancelled = error === "access_denied" || error === "user_cancelled_login";
      document.getElementById("badge").textContent = "!";
      document.getElementById("badge").style.setProperty("--tone", "var(--bad)");
      show("badge");
      setText("title", cancelled ? "Sign-in cancelled" : "Sign-in didn't complete");
      setText(
        "detail",
        cancelled
          ? "Nothing was changed. You can close this tab and try again from Job Tracker."
          : "Google or Apple reported: " + (params.get("error_description") || error) +
            ". Close this tab and try again from Job Tracker.",
      );
      setText("hint", "You are not signed in.");
      show("hint");
      return;
    }
    show("badge");
    setText("title", "You're signed in");
    if (handedOff) {
      // The launch already happened (automatic replace() above, or an earlier
      // click) — don't dangle a second "Open Job Tracker" invitation for the
      // same code+state. (The .app now handles a genuine replay gracefully too
      // — Packet A2 — but the button shouldn't invite one in the first place.)
      setText("detail", "You can close this tab.");
    } else {
      setText("detail", "Job Tracker has your sign-in.");
      show("open");
    }
    show("hint");
  }, 1200);
})();
</script>
</body>
</html>
